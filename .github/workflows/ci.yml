name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dsh 生态的包(@deepseek-ai/*)现在声明为 peerDependencies —— 运行期由 Harness 宿主提供,
      # 不在本包的 dependencies 里(桌面版宿主包打在 app.asar 内, 既不能 symlink 也不能 hoist)。
      # CI 没有 Harness 宿主, 所以装一份全局树, 把整棵 @deepseek-ai 树 symlink 进 node_modules 模拟宿主解析。
      # (dsh-agent-presets 依赖的 cordis-plugin-include / loader 也只存在于这棵树里; 与 README「dual-package hazard」一节同思路。)
      - name: Install Harness global tree & link host packages
        run: |
          npm i -g @deepseek-ai/dsh@0.2.2-rc.5
          GLOBAL=$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai
          mkdir -p node_modules/@deepseek-ai
          for p in "$GLOBAL"/*; do
            name=$(basename "$p")
            [ -e "node_modules/@deepseek-ai/$name" ] || ln -sfn "$p" "node_modules/@deepseek-ai/$name"
          done

      - name: TypeScript typecheck
        run: npx tsc -b --pretty false

      - name: Build (tsdown bundle)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Mutation checks
        run: npm run test:mutation

      - name: Host contract probe
        run: npm run contract

      - name: Python client syntax check
        run: python3 -m py_compile examples/hermes_dsh_mcp.py

      # 集成测试需要真实 Harness 实例 + 可用 LLM provider，仅本地自测，不进 CI。
