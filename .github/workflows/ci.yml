name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dsh-agent-presets (npm 独立版) 源码 import 的 cordis-plugin-include/loader
      # 未发布到 npm registry，只存在于 Harness 全局树 —— 从全局 dsh 装完 symlink 进来
      # （与 README 里 dual-package hazard 的修复循环同思路）
      - name: Install Harness global tree & link Harness-only peers
        run: |
          npm i -g @deepseek-ai/dsh@0.1.1-rc.2
          GLOBAL=$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai
          mkdir -p node_modules/@deepseek-ai
          for p in cordis-plugin-include cordis-plugin-loader; do
            ln -sfn "$GLOBAL/$p" "node_modules/@deepseek-ai/$p"
          done

      - name: TypeScript typecheck
        run: npx tsc -b --pretty false

      - name: Build (tsdown bundle)
        run: npm run build

      - name: Unit tests (mock ctx, standalone)
        run: |
          node tests/unit_mock_p1.mjs
          node tests/unit_mock_p2.mjs
          node tests/unit_mock_p3.mjs

      - name: Python client syntax check
        run: python3 -m py_compile examples/hermes_dsh_mcp.py

      # NOTE: 集成测试 (tests/integration_p1.py, tests/integration_p1_phase2.py)
      # 需要真实 Harness 实例 + 可用 LLM provider —— 在本地跑，不进 CI。